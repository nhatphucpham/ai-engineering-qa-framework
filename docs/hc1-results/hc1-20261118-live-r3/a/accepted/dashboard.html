nt":"accepted","obligationId":"cache-identity","rationale":"The same-category sequence returned the expected IDs when either page or size changed.","relation":"supports"},{"comparisonKey":"cache-switch","evidenceId":"hc1-a-b9a6825f40424794-e9","judgment":"accepted","obligationId":"cache-identity","rationale":"With page and size unchanged, the request for tools received the first books page. Wrong IDs alone contradict isolation by category.","relation":"violates"}],"contextEvidenceIds":[],"criterionId":"AC-03","evidenceIds":["hc1-a-b9a6825f40424794-e4","hc1-a-b9a6825f40424794-e5","hc1-a-b9a6825f40424794-e9"],"expected":"Tại API, cache phải giữ kết quả đúng cho từng bộ `(category, page, page_size)`; request category khác nhau trên cùng API instance không được dùng nhầm kết quả.","hasOpenCoverage":false,"reasonCodes":["CURRENT_BEHAVIOR_VIOLATION"],"requiredLevels":["integration"],"scopeDescription":"Check one in-process instance per sequence, with fixed catalog. Test repetition, changes to page and size, and a category change holding page and size fixed. The second response's count in the last sequence has no reached assertion.","sourceRefs":[{"artifactId":"artifact-1","locator":"AC-03"},{"artifactId":"artifact-6","locator":"L29-L33"},{"artifactId":"artifact-6","locator":"L35-L39"},{"artifactId":"artifact-8","locator":"L19-L25"}],"status":"failed"},{"bindings":[{"comparisonKey":"service-in","evidenceId":"hc1-a-b9a6825f40424794-e2","judgment":"accepted","obligationId":"stable-slice","rationale":"The observed service slice equals the second pair of books in catalog order.","relation":"supports"},{"comparisonKey":"api-in","evidenceId":"hc1-a-b9a6825f40424794-e5","judgment":"accepted","obligationId":"stable-slice","rationale":"The API returned the first two books, next two books and first book for the respective page and size choices.","relation":"supports"},{"comparisonKey":"service-end","evidenceId":"hc1-a-b9a6825f40424794-e2","judgment":"accepted","obligationId":"past-end","rationale":"Direct service assertion compares the entire response to empty items, filtered total 2 and page 3. The API boundary is covered by composition inference only.","relation":"supports"}],"contextEvidenceIds":[],"criterionId":"AC-04","evidenceIds":["hc1-a-b9a6825f40424794-e2","hc1-a-b9a6825f40424794-e5"],"expected":"Với một category cố định, service/API trả page ổn định theo thứ tự catalog, tối đa page_size item; page ngoài phạm vi trả items rỗng và giữ total của tập lọc. Tính đúng khi đổi category dùng chung cache được kiểm tra riêng ở AC-03.","hasOpenCoverage":true,"reasonCodes":["REQUIRED_COVERAGE_MISSING"],"requiredLevels":["integration"],"scopeDescription":"For a fixed category, service execution covers an in-range slice and an out-of-range empty page with preserved total. API execution directly covers ordered slices at pages 1 and 2 and sizes 2 and 1. API out-of-range behavior is inferred only: on a fresh miss the API returns and caches the unmodified service response (artifact-2 L10-L14, artifact-4 L4-L7). No API out-of-range assertion or repeated boundary request was offered; no inference across categories.","sourceRefs":[{"artifactId":"artifact-1","locator":"AC-04"},{"artifactId":"artifact-6","locator":"L19-L22"},{"artifactId":"artifact-6","locator":"L35-L39"}],"status":"unverified"}],"evidence":[{"checkArtifactId":"artifact-6","checkLocator":"L13-L17","executionRef":"hc1-a-b9a6825f40424794-execution","id":"hc1-a-b9a6825f40424794-e1","level":"unit","outcome":"pass","reason":null,"testId":"Baseline.test_service_category_and_case"},{"checkArtifactId":"artifact-6","checkLocator":"L19-L22","executionRef":"hc1-a-b9a6825f40424794-execution","id":"hc1-a-b9a6825f40424794-e2","level":"unit","outcome":"pass","reason":null,"testId":"Baseline.test_service_pagination_and_out_of_range"},{"checkArtifactId":"artifact-6","checkLocator":"L29-L33","executionRef":"hc1-a-b9a6825f40424794-execution","id":"hc1-a-b9a6825f40424794-e4","level":"integration","outcome":"pa rtLine":9,"text":"| AC-01 | Tại service `list_items`, category không rỗng được so khớp chính xác, phân biệt hoa thường; chỉ trả items thuộc category đó và total của tập đã lọc. |"},{"artifactId":"artifact-6","endLine":17,"locator":"L13-L17","relativePath":"tests/test_baseline.py","sha256":"46b74fb61dd0b3f5c4d7976b0d7a8b2cee4f7e1ca44edad5e197277aa044d315","startLine":13,"text":"    def test_service_category_and_case(self):\n        result = list_items('tools', 1, 2)\n        self.assertEqual(ids(result), ['T1', 'T2'])\n        self.assertEqual(result['total'], 2)\n        self.assertEqual(list_items('Tools', 1, 2)['total'], 0)"},{"artifactId":"artifact-1","endLine":10,"locator":"AC-02","relativePath":"requirements.md","sha256":"419e7e8d3e87cbfe38bd36de1d9ab7b974f578cc91960cd4bad1897525bb0820","startLine":10,"text":"| AC-02 | Tại UI state `select_category`, mỗi lần chọn category phải đưa page về 1 trước khi gọi API, kể cả đang ở page 3. |"},{"artifactId":"artifact-6","endLine":46,"locator":"L41-L46","relativePath":"tests/test_baseline.py","sha256":"46b74fb61dd0b3f5c4d7976b0d7a8b2cee4f7e1ca44edad5e197277aa044d315","startLine":41,"text":"    def test_ui_select_from_first_page(self):\n        view = CatalogView(CatalogAPI())\n        result = view.select_category('tools')\n        self.assertEqual(view.category, 'tools')\n        self.assertEqual(view.page, 1)\n        self.assertEqual(ids(result), ['T1', 'T2'])"},{"artifactId":"artifact-7","endLine":12,"locator":"L8-L12","relativePath":"tests/test_historical.py","sha256":"4234afad5bbda80bf1afe1db1f46ba52e2008dd30d5234a7d37c9db3375f74fc","startLine":8,"text":"    def test_reset_from_third_page(self):\n        view = CatalogView(CatalogAPI(), category='books', page=3)\n        result = view.select_category('tools')\n        self.assertEqual(view.page, 1)\n        self.assertEqual([item['id'] for item in result['items']], ['T1', 'T2'])"},{"artifactId":"artifact-8","endLine":17,"locator":"L8-L17","relativePath":"expected/test_probe.py","sha256":"23311f292e35e53af72449ab62e7f27e5e16e3c60e204ec2a2290851ba162fbb","startLine":8,"text":"    def test_reset_with_recorded_api_call(self):\n        class RecordingAPI(CatalogAPI):\n            def get_items(self, category, page, page_size=2):\n                self.request = (category, page, page_size)\n                return super().get_items(category, page, page_size)\n\n        api = RecordingAPI()\n        view = CatalogView(api, category='books', page=3)\n        view.select_category('tools')\n        self.assertEqual(api.request, ('tools', 1, 2))"},{"artifactId":"artifact-1","endLine":11,"locator":"AC-03","relativePath":"requirements.md","sha256":"419e7e8d3e87cbfe38bd36de1d9ab7b974f578cc91960cd4bad1897525bb0820","startLine":11,"text":"| AC-03 | Tại API, cache phải giữ kết quả đúng cho từng bộ `(category, page, page_size)`; request category khác nhau trên cùng API instance không được dùng nhầm kết quả. |"},{"artifactId":"artifact-6","endLine":33,"locator":"L29-L33","relativePath":"tests/test_baseline.py","sha256":"46b74fb61dd0b3f5c4d7976b0d7a8b2cee4f7e1ca44edad5e197277aa044d315","startLine":29,"text":"    def test_api_repeat_same_request(self):\n        api = CatalogAPI()\n        self.assertEqual(ids(api.get_items('tools', 1)), ['T1', 'T2'])\n        self.assertEqual(ids(api.get_items('tools', 1)), ['T1', 'T2'])\n        self.assertEqual(len(api.cache), 1)"},{"artifactId":"artifact-6","endLine":39,"locator":"L35-L39","relativePath":"tests/test_baseline.py","sha256":"46b74fb61dd0b3f5c4d7976b0d7a8b2cee4f7e1ca44edad5e197277aa044d315","startLine":35,"text":"    def test_api_page_and_size(self):\n        api = CatalogAPI()\n        self.assertEqual(ids(api.get_items('books', 1, 2)), ['B1', 'B2'])\n        self.assertEqual(ids(api.get_items('books', 2, 2)), ['B3', 'B4'])\n        self.assertEqual(ids(api.get_items('books', 1, 1)), ['B1'])"},{"artifactId":"artifact-8","endLine":25,"locator":"L19-L25","relativePath":"expected/test_probe.py","sha256":"23311f292e35e53af72449ab62e7f27e5e16e3c60e204ec2a2290851ba162fbb","startLine":19,"text":"    def test_cache_across_categories(self):\n        api = CatalogAPI()\n        first = api.get_items('books', 1, 2)\n        second = api.get_items('tools', 1, 2)\n        self.assertEqual([item['id'] for item in first['items']], ['B1', 'B2'])\n        self.assertEqual([item['id'] for item in second['items']], ['T1', 'T2'])\n        self.assertEqual(second['total'], 2)"},{"artifactId":"artifact-1","endLine":12,"locator":"AC-04","relativePath":"requirements.md","sha256":"419e7e8d3e87cbfe38bd36de1d9ab7b974f578cc91960cd4bad1897525bb0820","startLine":12,"text":"| AC-04 | Với một category cố định, service/API trả page ổn định theo thứ tự catalog, tối đa page_size item; page ngoài phạm vi trả items rỗng và giữ total của tập lọc. Tính đúng khi đổi category dùng chung cache được kiểm tra riêng ở AC-03. |"},{"artifactId":"artifact-6","endLine":22,"locator":"L19-L22","relativePath":"tests/test_baseline.py","sha256":"46b74fb61dd0b3f5c4d7976b0d7a8b2cee4f7e1ca44edad5e197277aa044d315","startLine":19,"text":"    def test_service_pagination_and_out_of_range(self):\n        self.assertEqual(ids(list_items('books', 2, 2)), ['B3', 'B4'])\n        result = list_items('tools', 3, 2)\n        self.assertEqual(result, {'items': [], 'total': 2, 'page': 3})"}],"verification":"failed","viewVersion":"vf1-view-1.0.0"}],"version":"vf1-viewer-1.0.0"}</script>
  <script>
  (() => {
    const root=document.getElementById('vf1-report');
    const data=JSON.parse(document.getElementById('vf1-data').textContent);
    const labels={verified:'Đã kiểm chứng',failed:'Vi phạm',unverified:'Chưa kiểm chứng',not_applicable:'Không áp dụng'};
    const names={'AC-01':'Lọc category','AC-02':'Reset trang khi đổi lọc','AC-03':'Cache theo category','AC-04':'Phân trang và page size'};
    const saved=window.openai?.widgetState;
    let run=Number.isInteger(saved?.privateContent?.run) && saved.privateContent.run>=0 && saved.privateContent.run<data.reports.length?saved.privateContent.run:0;
    let criterion=['AC-01','AC-02','AC-03','AC-04'].includes(saved?.privateContent?.criterion)?saved.privateContent.criterion:'AC-04';
    const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
    const persist=()=>{window.openai?.setWidgetState?.({modelContent:{runId:data.reports[run].runId,criterionId:criterion},privateContent:{run,criterion}})?.catch(()=>{});};
    function render(){
      const focused=document.activeElement;
      const focusRun=root.contains(focused)?focused.dataset.run:undefined;
      const focusCriterion=root.contains(focused)?focused.dataset.criterion:undefined;
      const report=data.reports[run];
      const buttons=root.querySelector('.runs');buttons.replaceChildren();
      data.reports.forEach((item,index)=>{const button=el('button','Lần chạy · '+item.runId);button.type='button';button.dataset.run=String(index);button.setAttribute('aria-pressed',String(index===run));button.onclick=()=>{run=index;render();persist();};buttons.append(button);});
      const summary=root.querySelector('.summary');summary.replaceChildren();
      summary.append(el('strong',report.verification==='failed'?'Có vi phạm yêu cầu':report.verification==='incomplete'?'Chưa đủ bằng chứng':'Hoàn tất trong scope'));
      summary.append(el('p',report.hasUnverifiedMandatory||report.hasOpenMandatoryCoverage?'Còn thiếu bằng chứng bắt buộc. Vi phạm đã có evidence vẫn được giữ.':'Không còn gap bắt buộc trong scope đánh giá đã ghi.'));
      summary.append(el('p','Human decision: '+report.humanDecision+' · không tự phê duyệt','sub'));
      const nav=root.querySelector('.criteria');nav.replaceChildren();
      report.criteria.forEach(item=>{const button=el('button',undefined,'criterion');button.type='button';button.dataset.criterion=item.criterionId;button.setAttribute('aria-pressed',String(item.criterionId===criterion));button.append(el('span',item.criterionId+' · '+names[item.criterionId]),el('span',labels[item.status]||item.status,'badge '+item.status));button.onclick=()=>{criterion=item.criterionId;render();persist();};nav.append(button);});
      const selected=report.criteria.find(item=>item.criterionId===criterion);
      const detail=root.querySelector('.detail');detail.replaceChildren();
      detail.append(el('h2',selected.criterionId+' · '+labels[selected.status]),el('p',selected.expected),el('p',selected.scopeDescription,'sub'));
      if(selected.hasOpenCoverage)detail.append(el('p','Còn gap coverage bắt buộc ở tiêu chí này; trạng thái vi phạm (nếu có) vẫn được giữ.'));
      if(selected.reasonCodes.length)detail.append(el('p','Core reasons: '+selected.reasonCodes.join(', ')));
      detail.append(el('h3','Evidence của lần chạy này'));
      const evidenceList=el('ul');
      report.evidence.filter(item=>selected.bindings.some(binding=>binding.evidenceId===item.id)).forEach(item=>{
        const li=el('li');li.append(el('strong',item.outcome+' · '+item.testId),el('p',item.level+' · '+item.id,'sub'));
        selected.bindings.filter(binding=>binding.evidenceId===item.id).forEach(binding=>li.append(el('p',binding.relation+' · '+binding.rationale)));
        evidenceList.append(li);
      });
      if(!evidenceList.children.length)evidenceList.append(el('li','Không có observation phù hợp được trích dẫn. Source test không thay thế kết quả chạy.'));
      detail.append(evidenceList,el('h3','Việc cần làm'));
      const actions=report.actions.filter(action=>action.criterionIds.includes(selected.criterionId));
      if(!actions.length)detail.append(el('p','Không có action mở từ core cho tiêu chí này.'));
      actions.forEach(action=>{detail.append(el('p',action.description),el('p','Owner: '+action.ownerRole+' · '+action.state,'sub'),el('p','Done when: '+action.doneWhen));});
      detail.append(el('h3','Requirement, source và assertion đã dẫn'));
      selected.sourceRefs.forEach(ref=>{const source=report.sourceExcerpts.find(item=>item.artifactId===ref.artifactId&&item.locator===ref.locator);if(!source)return;const details=el('details');details.append(el('summary',source.relativePath+' · '+source.locator));const pre=el('pre');pre.append(el('code',source.text));details.append(pre,el('p','SHA-256: '+source.sha256,'sub'));detail.append(details);});
      const meta=root.querySelector('.provenance');meta.replaceChildren();
      ['runId','reportId','candidateRevision','requirementVersion','executionRef','executionSha256','jobDigest','observedAt'].forEach(key=>meta.append(el('p',key+': '+report[key])));
      meta.append(el('p','Host-mediated reasoning qua agent của phiên hiện tại; core tạo internal derived candidate. Viewer chỉ đọc, không khởi chạy backend. Chưa là connector tự chạy, app desktop hay readiness toàn sản phẩm. AC-05 ngoài scope; quyết định whitespace v2 không bị mở lại.'));
      if(focusRun!==undefined)root.querySelector(`[data-run="${focusRun}"]`)?.focus({preventScroll:true});
      else if(focusCriterion!==undefined)root.querySelector(`[data-criterion="${focusCriterion}"]`)?.focus({preventScroll:true});
    }
    window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(!state)return;if(Number.isInteger(state.run)&&state.run>=0&&state.run<data.reports.length)run=state.run;if(['AC-01','AC-02','AC-03','AC-04'].includes(state.criterion))criterion=state.criterion;render();});
    render();
  })();
  </script>
</div>
</body></html>
